spring.config.import=optional:file:.env[.properties]

spring.application.name=capstone-baker-ai
# ===== Datasource (values from .env) =====
spring.datasource.url=jdbc:postgresql://${NEON_HOSTNAME}/${NEON_DBNAME}?sslmode=require
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}

# Validate schema only; Flyway owns database changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.open-in-view=false

# ===== Cloudflare R2 =====
app.r2.endpoint=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
app.r2.access-key-id=${R2_ACCESS_KEY_ID}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY}

app.r2.public-bucket=${R2_PUBLIC_BUCKET}
app.r2.private-bucket=${R2_PRIVATE_BUCKET}
app.r2.public-url=${R2_PUBLIC_URL:}
app.r2.presigned-url-duration=PT10M

# PayOS
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}
payos.webhook-url=${PAYOS_WEBHOOK_URL}

# ===== Gmail SMTP =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${GMAIL_USERNAME:}
app.verification-code-expiration=PT10M

# ===== JWT =====
app.jwt.issuer=capstone-baker-ai
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P30D
app.jwt.secret-base64=${JWT_SECRET_BASE64}
#deploy REFRESH_COOKIE_SECURE = true
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
#khac domain REFRESH_COOKIE_SAME_SITE = none
app.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}