spring.config.import=optional:file:.env[.properties]

spring.application.name=capstone-baker-ai
# ===== Datasource (dùng bi?n t? .env) =====
spring.datasource.url=jdbc:postgresql://${NEON_HOSTNAME}/${NEON_DBNAME}?sslmode=require
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}

# QUAN TR?NG: Ch? validate, không ?? Hibernate t? s?a DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.open-in-view=false